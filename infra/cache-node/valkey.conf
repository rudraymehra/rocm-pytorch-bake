# Valkey 9.1 for the shared sccache level. Data is a rebuildable cache:
# no persistence, bounded memory, least-recently-used eviction.
#
# bind is replaced by install.sh with the LAN address of this node.
bind CACHE_NODE_IP 127.0.0.1
port 6379
protected-mode yes
aclfile /etc/valkey/users.acl

# Start at 32gb and resize after the first cold build (INFO memory, used_memory_dataset).
# Keep at least 20% of the host RAM free.
maxmemory 32gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# No RDB snapshots and no AOF: a fork for a snapshot can need up to 2x RAM, and
# losing the cache only costs one cold build.
save ""
appendonly no

# Socket I/O threads; needs >= 6 cores on this node (one spare).
io-threads 4

lazyfree-lazy-eviction yes
lazyfree-lazy-user-del yes
tcp-keepalive 300
timeout 0
